name: CI - Abodi ML Module

on:
  push:
    branches: [main]
    paths:
      - "ml_module/**"
  pull_request:
    branches: [main]
    paths:
      - "ml_module/**"

defaults:
  run:
    working-directory: ./ml_module

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic data
        run: |
          python src/generate_data.py

      - name: Run ETL
        run: |
          python src/etl.py

      - name: Train model (3 experiments)
        run: |
          python src/train.py

      - name: Select best model
        run: |
          python src/select_best.py

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linter
        run: |
          cd ml_module && ruff check src/ api/ app/ tests/ --ignore=E402,F401

  docker-build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          cd ml_module && docker build -t abodi-ml-api -f docker/Dockerfile.api .

      - name: Build Streamlit Docker image
        run: |
          cd ml_module && docker build -t abodi-ml-app -f docker/Dockerfile.app .
